default-run = "codex-web-gpui"

[[bin]]
name = "codex-web-gpui"
path = "src/main.rs"

[[bin]]
name = "codex-web-gpui_helper"
path = "src/helper.rs"

[[bin]]
name = "bundle-codex-web-gpui"
