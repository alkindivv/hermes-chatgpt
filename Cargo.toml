[workspace]
resolver = "2"
members = ["crates/contracts", "crates/bridge", "crates/runtime", "crates/browser", "crates/app"]
default-members = ["crates/contracts", "crates/bridge", "crates/runtime"]
exclude = ["vendor/upstream", "vendor/gpui-cef"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.99"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "process", "io-util", "fs", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tempfile = "3"
gpui = { git = "https://github.com/zed-industries/zed", rev = "ef075910c99ce2c8fd07da4174e7c3bb71513f35" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "ef075910c99ce2c8fd07da4174e7c3bb71513f35", features = ["font-kit", "runtime_shaders"] }
gpui-cef = { path = "vendor/gpui-cef/crates/gpui-cef" }
cef = { version = "=151.8.0", features = ["build-util"] }
cw-contracts = { path = "crates/contracts" }
cw-bridge = { path = "crates/bridge" }
cw-runtime = { path = "crates/runtime" }
cw-browser = { path = "crates/browser" }

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[profile.release]
strip = "debuginfo"
lto = "thin"
codegen-units = 8
